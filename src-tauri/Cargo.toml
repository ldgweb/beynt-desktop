[package]
name = "beynt-desktop"
version = "0.7.1"
description = "Beynt desktop: your Beynt commands and notes from any app"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-window-state = "=2.5.0"
futures-util = "0.3"
# Windows Credential Manager, the macOS Keychain, the Secret Service on Linux.
keyring = "4"
# rustls with the system's certificate verifier and proxy: a company's own CA and proxy work.
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
